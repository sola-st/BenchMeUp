# Host-side caching proxy for Maven repositories (optional).
# Why: every candidate's image build and warm-up re-downloads its dependencies, and Maven
# Central blocks a host that downloads the same files again and again (429, escalating).
# One download per artifact, then served from disk. Images opt in through a build argument
# (MAVEN_MIRROR) whose default is the vendor URL, so shipped instances stay portable.
#   http://172.17.0.1:8081/maven2/          -> https://repo1.maven.org/maven2/
#   http://172.17.0.1:8081/gradle-plugins/  -> https://plugins.gradle.org/m2/
#   http://172.17.0.1:8081/google/          -> https://dl.google.com/dl/android/maven2/
# Run: infra/maven-cache/run.sh   Logs: docker logs bench-maven-cache (cache=HIT|MISS per line)
worker_processes auto;
events { worker_connections 2048; }

http {
    proxy_cache_path /cache levels=1:2 keys_zone=m2:200m max_size=200g inactive=90d use_temp_path=off;
    log_format cache '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'cache=$upstream_cache_status rt=$request_time';
    access_log /dev/stdout cache;
    error_log /dev/stderr warn;

    server {
        listen 80;
        client_max_body_size 0;

        proxy_cache m2;
        proxy_cache_key $uri;
        proxy_cache_valid 200 206 90d;
        proxy_cache_valid 404 10m;
        # A vendor block or outage serves what is already on disk instead of failing the build.
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503 http_504;
        # Twenty workers asking for one artifact at once cause one upstream download.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 900s;
        proxy_cache_lock_age 900s;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_connect_timeout 30s;
        proxy_read_timeout 900s;
        proxy_max_temp_file_size 0;
        add_header X-Cache $upstream_cache_status always;

        # Maven Central is fetched through Google's mirror of it (same files). To use Maven
        # Central directly: proxy_pass https://repo1.maven.org/maven2/ with Host repo1.maven.org.
        location /maven2/ {
            proxy_pass https://maven-central.storage-download.googleapis.com/maven2/;
            proxy_set_header Host maven-central.storage-download.googleapis.com;
        }
        location /gradle-plugins/ {
            proxy_pass https://plugins.gradle.org/m2/;
            proxy_set_header Host plugins.gradle.org;
        }
        location /google/ {
            proxy_pass https://dl.google.com/dl/android/maven2/;
            proxy_set_header Host dl.google.com;
        }
        location = /health {
            return 200 "ok\n";
        }
    }
}
