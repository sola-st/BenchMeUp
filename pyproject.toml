[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmeup"
version = "0.1.0"
description = "From a natural-language task description to an executable, re-judgeable benchmark, built by LLM agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "litellm>=1.50",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "docker>=7.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "httpx>=0.27"]
ui = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
bench = "benchcompiler.bench_cli:main"
bench-ui = "benchcompiler.ui.app:main"
bench-ui-export = "benchcompiler.ui.export:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchcompiler*", "agentcore*"]

[tool.setuptools.package-data]
"agentcore" = ["config/*.yaml"]
"benchcompiler.ui" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "benchcompiler/tests"]
addopts = "-q"
markers = [
    "docker: needs a reachable docker daemon (auto-skipped when it is not)",
    "e2e: drives a full agent loop",
    "network: performs live network fetches",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["benchmarks", "stock", "runs", "*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["E402"]
"benchcompiler/tests/**" = ["E402"]
"agentcore/run/single.py" = ["E402"]
"benchcompiler/bench_cli.py" = ["E402"]
"agentcore/agent/field_contract.py" = ["E402"]
