# A WORKER does instance construction and nothing else: it takes candidates one at a
# time, builds each as a directory of scripts through the stages the family config
# declares, and the system checks every stage in a fresh container. One loop, one prompt.
# The run ends when the target is met or the budget is spent; the system writes the run
# summary from the record (`bench recipes-summary <run_dir>`).
#
# GENERATED by `bench worker` from the spec, the canonical and contract.json. The stage
# states are rendered from contract.json; regenerate rather than edit.

name: pending_sonarqube_warning_fix_worker
description: 'Analyze and fix a SonarQube warning in a project without introducing a new warning - analyzer:
  SonarQube, server inside the instance, fed by its scanner - SonarQube''s report is the verdict'
loop: standard
action_protocol: json
models:
  main:
    name: example/model
    temperature: 0.3
    kwargs:
      max_tokens: 32000
      timeout: 600
env:
  type: deferred
  workdir: /workspace
  build_on_write:
  - Dockerfile
  timeout: 1800
  container_lifetime: 28800s
  resources:
    mem_limit: 8g
tools:
- write_to_file
- str_replace
- read_file
- linux_terminal
- bench_check
- bench_deliver
- drop_candidate
tool_modules:
- agentcore.tools.recipes_tools
prompts:
  system: ../_shared/worker_system.j2
  cycle: ../_shared/worker_cycle.j2
prerender: agentcore.tools.recipes_tools:prerender
worklist:
  enabled: true
  key:
  - clone_url
  - head_sha
  normalize:
    clone_url: git_url
    head_sha: full_sha
  caps:
  - dimension: per_repository
    keys:
    - clone_url
    limit: 3
  - dimension: per_commit
    keys:
    - clone_url
    - head_sha
    limit: 1
  terminal:
  - STAGE_3_WRITE_SONARQUBE_VERDICT
  publish_to: final_sample
  publish_on: []
  derive_calibration_to: calibration_result
  states:
  - name: REGISTERED
    requires:
    - clone_url
    - head_sha
    instruction: The system hands you this candidate; its identity is clone_url, head_sha, exactly as
      the search step recorded it. Your instance.json carries these same values.
    verify: agentcore.agent.collector_gates:candidate_is_admissible
  - name: STAGE_1_INSTALL_SONARQUBE_SCANNER
    requires:
    - stage_1_delivered
    instruction: '(stage 1 of 3: install SonarQube and the scanner, then find the warning pair -- rendered
      from contract.json at run time)'
    verify: agentcore.tools.recipes_tools:stage_gate_1
  - name: STAGE_2_CHECK_OUT_EACH_REVISION
    requires:
    - stage_2_delivered
    instruction: '(stage 2 of 3: check out each revision, patch it and compile it offline -- rendered
      from contract.json at run time)'
    verify: agentcore.tools.recipes_tools:stage_gate_2
  - name: STAGE_3_WRITE_SONARQUBE_VERDICT
    requires:
    - stage_3_delivered
    instruction: '(stage 3 of 3: write the SonarQube verdict script and the revert -- rendered from contract.json
      at run time)'
    verify: agentcore.tools.recipes_tools:stage_gate_3
instance_schema: instances.schema:WorkerTask
tool_output:
  strategy: heuristic
  truncation: head_tail
oracle:
  kind: sentinel
  grade: agentcore.tools.recipes_tools:finish_gate
budgets:
  meters:
  - kind: cost_usd
    limit: 2.0
    charge_on: cycle
  - kind: wallclock
    limit: 21600
    on_exhaust: finish_cycle
attempts:
  enabled: false
repetition:
  exempt_tools:
  - linux_terminal
  - container_exec
  - bench_check
