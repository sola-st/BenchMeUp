# A SEARCHING AGENT finds candidates for a benchmark and nothing else: it plans its own
# search, writes scripts that query in bulk, vets the results, and appends what it accepts
# to stock/candidates.jsonl. It ends the run by writing stock/check.sh (every candidate
# exists) and calling stock_verify; the system runs that script in a fresh container and
# counts. The run ends when the check passes at the target, or when the budget is spent.
#
# GENERATED by `bench search-agent` from the spec and its canonical; nothing here is drawn
# by a model. The brief is instances/instances.jsonl. Regenerate rather than edit.

name: boca_search
description: Given a C program and a target compiler, an automated compiler-autotuning technique searches
  for an optimization-flag configuration that minimizes the program's runtime while preserving its output
  behavior.
loop: standard
action_protocol: json
models:
  main:
    name: example/model
    temperature: 0.3
    kwargs:
      max_tokens: 32000
env:
  type: docker
  image: python:3.12-bookworm
  workdir: /workspace
  timeout: 900
  container_lifetime: 48h
  resources:
    mem_limit: 4g
tools:
- write_to_file
- str_replace
- read_file
- linux_terminal
- launch_background
- poll_process
- stock_add
- stock_remove
- stock_verify
tool_modules:
- agentcore.tools.search_tools
prompts:
  system: ../_shared/search_system.j2
  cycle: ../_shared/search_cycle.j2
prerender: agentcore.tools.search_tools:prerender
stall:
  watch:
  - search.stock
  - search.verifies
  nudge_after: 8
instance_schema: instances.schema:SearchTask
tool_output:
  strategy: heuristic
  truncation: head_tail
oracle:
  kind: sentinel
  grade: agentcore.tools.search_tools:finish_gate
budgets:
  meters:
  - kind: cost_usd
    limit: 25.0
    charge_on: cycle
  - kind: wallclock
    limit: 21600
    on_exhaust: finish_cycle
attempts:
  enabled: false
repetition:
  exempt_tools:
  - linux_terminal
  - poll_process
  - stock_verify
  - read_file
