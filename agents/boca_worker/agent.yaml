# A WORKER does instance construction and nothing else: it takes candidates one at a
# time, builds each as a directory of scripts through the stages the family config
# declares, and the system checks every stage in a fresh container. One loop, one prompt.
# The run ends when the target is met or the budget is spent; the system writes the run
# summary from the record (`bench recipes-summary <run_dir>`).
#
# GENERATED by `bench worker` from the spec, the canonical and contract.json. The stage
# states are rendered from contract.json; regenerate rather than edit.

name: boca
description: Given a C program and a target compiler, an automated compiler-autotuning technique searches
  for an optimization-flag configuration that minimizes the program's runtime while preserving its output
  behavior.
loop: standard
action_protocol: json
models:
  main:
    name: example/model
    temperature: 0.3
    kwargs:
      max_tokens: 32000
env:
  type: deferred
  workdir: /workspace
  build_on_write:
  - Dockerfile
  timeout: 1800
  container_lifetime: 28800s
  resources:
    mem_limit: 8g
tools:
- write_to_file
- str_replace
- read_file
- linux_terminal
- bench_check
- bench_deliver
- drop_candidate
tool_modules:
- agentcore.tools.recipes_tools
prompts:
  system: ../_shared/worker_system.j2
  cycle: ../_shared/worker_cycle.j2
prerender: agentcore.tools.recipes_tools:prerender
worklist:
  enabled: true
  key:
  - repo_url
  - commit_sha
  - program_name
  normalize:
    repo_url: git_url
    commit_sha: full_sha
    program_name: none
  caps:
  - dimension: per_repository
    keys:
    - repo_url
    limit: 3
  - dimension: per_candidate
    keys:
    - repo_url
    - commit_sha
    - program_name
    limit: 1
  - dimension: per_org
    keys:
    - repo_url
    limit: 5
  terminal:
  - STAGE_4_GROW_COSTLIEST_INPUT_TIMING
  publish_to: final_sample
  publish_on: []
  derive_calibration_to: calibration_result
  states:
  - name: REGISTERED
    requires:
    - repo_url
    - commit_sha
    - program_name
    instruction: The system hands you this candidate; its identity is repo_url, commit_sha, program_name,
      exactly as the search step recorded it. Your instance.json carries these same values.
    verify: agentcore.agent.collector_gates:candidate_is_admissible
  - name: STAGE_1_INSTALL_TOOLCHAIN_CLONE
    requires:
    - stage_1_delivered
    instruction: '(stage 1 of 4: install the toolchain, clone the commit and locate the build recipe --
      rendered from contract.json at run time)'
    verify: agentcore.tools.recipes_tools:stage_gate_1
  - name: STAGE_2_WRITE_BUILD_THAT_HONOURS
    requires:
    - stage_2_delivered
    instruction: '(stage 2 of 4: write a build that honours CFLAGS -- rendered from contract.json at run
      time)'
    verify: agentcore.tools.recipes_tools:stage_gate_2
  - name: STAGE_3_RUN_PROGRAM_GENERATE_INPUTS
    requires:
    - stage_3_delivered
    instruction: '(stage 3 of 4: run the program, generate inputs and break it on purpose -- rendered
      from contract.json at run time)'
    verify: agentcore.tools.recipes_tools:stage_gate_3
  - name: STAGE_4_GROW_COSTLIEST_INPUT_TIMING
    requires:
    - stage_4_delivered
    instruction: '(stage 4 of 4: grow the costliest input into the timing band -- rendered from contract.json
      at run time)'
    verify: agentcore.tools.recipes_tools:stage_gate_4
instance_schema: instances.schema:WorkerTask
tool_output:
  strategy: heuristic
  truncation: head_tail
oracle:
  kind: sentinel
  grade: agentcore.tools.recipes_tools:finish_gate
budgets:
  meters:
  - kind: cost_usd
    limit: 2.0
    charge_on: cycle
  - kind: wallclock
    limit: 21600
    on_exhaust: finish_cycle
attempts:
  enabled: false
repetition:
  exempt_tools:
  - linux_terminal
  - container_exec
  - bench_check
